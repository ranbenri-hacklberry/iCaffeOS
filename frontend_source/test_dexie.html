<!DOCTYPE html>
<html>
<head>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body>
    <script>
        const db = new Dexie('KDSDatabase');
        db.version(2).stores({
            item_category: 'id, name, name_he, business_id, position'
        });
        db.item_category.toArray().then(cats => {
            document.body.innerHTML += "Categories in Dexie: " + cats.length + "<br>";
            cats.forEach(c => {
                document.body.innerHTML += JSON.stringify(c) + "<br>";
            });
        }).catch(e => {
            document.body.innerHTML += "Error: " + e;
        });
    </script>
</body>
</html>
