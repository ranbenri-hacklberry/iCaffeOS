mqtt:
  enabled: false

cameras:
  esp32_cam:
    enabled: true
    ffmpeg:
      inputs:
        - path: http://192.168.1.100/stream # REPLACE_WITH_ESP32_IP
          roles:
            - detect
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5

  # --- USB Camera Configuration ---
  usb_cam:
    enabled: true
    ffmpeg:
      inputs:
        - path: /dev/video0
          input_args: -f v4l2
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5

detectors:
  ov:
    type: cpu

# Frigate 0.14+ config
version: 0.17-0
detect:
  enabled: true
